version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - unconvert
    - gosec
    - errorlint
  settings:
    misspell:
      ignore-rules:
        - documentaires # French UI strings
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (io.Closer).Close
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck already checks them, with the exclusions above
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ermos/kinora
