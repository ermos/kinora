name: Release

# Every push to main: feat bumps the minor, fix/perf the patch, a breaking change (! or BREAKING CHANGE) the major.
# Other commit types (chore, docs, ci...) don't release.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          default_bump: false

  image:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Without the KINORA_KEYSTORE_BASE64 secret the APK is signed with the debug key, and updates won't install over it.
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.KINORA_KEYSTORE_BASE64 }}
        run: |
          [ -z "$KEYSTORE" ] && exit 0
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KINORA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: npm run tv:apk
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          KINORA_KEYSTORE_PASSWORD: ${{ secrets.KINORA_KEYSTORE_PASSWORD }}
          KINORA_KEY_ALIAS: ${{ secrets.KINORA_KEY_ALIAS }}
      - run: gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk --verify-tag --generate-notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
