# kinora: https://kinora.stream/docs/installation
# Put TMDB_API_KEY=your_key in a .env file next to this one, then: docker compose up -d
services:
  kinora:
    image: ghcr.io/ermos/kinora:latest
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?set TMDB_API_KEY in .env (free key at https://www.themoviedb.org/settings/api)}
      DATABASE_URL: postgres://kinora:kinora@postgres:5432/kinora?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kinora
      POSTGRES_PASSWORD: kinora
      POSTGRES_DB: kinora
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kinora"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Optional: lets kinora search the sites behind Cloudflare. Enable it in Account > FlareSolverr with
  # http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped

volumes:
  postgres:
